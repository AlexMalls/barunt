:root {
  color-scheme: dark;
  --background: #1a1710;
  --foreground: #e7e4dd;
  --card: #231f17;
  --card-foreground: #e7e4dd;
  --popover: #312c20;
  --popover-foreground: #e7e4dd;
  --primary: #baaf92;
  --primary-foreground: #221e15;
  --secondary: #342f23;
  --secondary-foreground: #e7e4dd;
  --muted: #2c281d;
  --muted-foreground: #bab29c;
  --accent: #443e2f;
  --accent-foreground: #e7e4dd;
  --destructive: #e5a59c;
  --border: #443f30;
  --input: #504937;
  --ring: #c3b17e;
  --radius: .5rem;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font: 14px/1.5 Arial,Helvetica,sans-serif;
}
button,input,textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: .35;
  cursor: not-allowed;
}
a {
  color: #d5cbb2;
  text-underline-offset: 4px;
}
input,textarea {
  background: #1d1911;
  border: 1px solid #4e4837;
  border-radius: 5px;
  color: #e7e4dd;
  padding: 9px 11px;
  min-width: 0;
  max-width: 100%;
  outline: none;
}
input:focus,textarea:focus {
  border-color: #c5b684;
  box-shadow: 0 0 0 2px #c5b68420;
}
textarea {
  width: 100%;
  resize: vertical;
  min-height: 78px;
  line-height: 1.6;
}
input::placeholder,textarea::placeholder {
  color: #a19578;
}
button:focus-visible,summary:focus-visible {
  outline: 2px solid #c3b17e;
  outline-offset: 4px;
}
svg {
  flex-shrink: 0;
}
strong,b {
  font-weight: 600;
}
p {
  margin: 0;
}
h1,h2 {
  margin: 0;
}
small {
  font-size: 11px;
}
summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
summary::-webkit-details-marker {
  display: none;
}
details[open]>summary>svg:last-child {
  transform: rotate(90deg);
}
summary>svg {

<script id="barunt-tablet-session-script">
(function () {
  'use strict';
  const html = document.documentElement;
  const isIPad = /iPad/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isTouchTablet = navigator.maxTouchPoints > 1 &&
    Math.min(screen.width, screen.height) >= 600 && window.matchMedia('(pointer: coarse)').matches;
  const isTablet = isIPad || isTouchTablet;
  const densities = ['comfortable', 'compact', 'tight'];
  let frameQueued = false;
  let fitting = false;
  let rerun = false;
  let resetRequested = true;

  function labelSpellSlots() {
    document.querySelectorAll('.play-dashboard .resource-title > b').forEach(function (label) {
      const name = label.textContent.trim();
      const level = name.match(/Espaços de magia\s*[·-]\s*(\d+)/i);
      if (level) {
        const shortName = level[1] + 'º nível';
        if (label.getAttribute('data-slot-label') !== shortName) label.setAttribute('data-slot-label', shortName);
        if (label.getAttribute('title') !== name) label.setAttribute('title', name);
      } else if (label.hasAttribute('data-slot-label')) {
        label.removeAttribute('data-slot-label');
        label.removeAttribute('title');
      }
    });
  }

  function fitPanels() {
    frameQueued = false;
    if (!html.hasAttribute('data-tablet-session')) return;
    const dashboard = document.querySelector('.play-mode .play-dashboard[data-state="active"]');
    if (!dashboard) return;
    fitting = true;
    labelSpellSlots();
    let density = resetRequested ? 0 : Math.max(0, densities.indexOf(html.getAttribute('data-session-density')));
    resetRequested = false;
    html.setAttribute('data-session-density', densities[density]);
    function measure() {
      if (!html.hasAttribute('data-tablet-session')) { fitting = false; return; }
      const panels = Array.from(dashboard.querySelectorAll('.panel'));
      const overflows = panels.some(function (panel) {
        return panel.clientHeight > 0 &&
          (panel.scrollHeight > panel.clientHeight + 2 || panel.scrollWidth > panel.clientWidth + 2);
      });
      if (overflows && density < densities.length - 1) {
        html.setAttribute('data-session-density', densities[++density]);
        window.requestAnimationFrame(measure);
        return;
      }
      html.toggleAttribute('data-session-overflow', overflows);
      fitting = false;
      if (rerun) { rerun = false; scheduleFit(false); }
    }
    window.requestAnimationFrame(measure);
  }

  function scheduleFit(reset) {
    if (!html.hasAttribute('data-tablet-session')) return;
    resetRequested = resetRequested || reset;
    if (fitting) { rerun = true; return; }
    if (frameQueued) return;
    frameQueued = true;
    window.requestAnimationFrame(fitPanels);
  }

  function updateMode() {
    const active = isTablet && window.innerWidth >= 1024 && window.innerWidth > window.innerHeight;
    if (active) {
      html.setAttribute('data-tablet-session', 'landscape');
      html.style.setProperty('--tablet-viewport-height', Math.round(window.innerHeight) + 'px');
      scheduleFit(true);
    } else {
      html.removeAttribute('data-tablet-session');
      html.removeAttribute('data-session-density');
      html.removeAttribute('data-session-overflow');
    }
  }

  function observeSheet() {
    const appRoot = document.getElementById('root');
    if (appRoot) {
      // Attribute changes made by the fitter do not observe themselves.
      const observer = new MutationObserver(function () { scheduleFit(false); });
      observer.observe(appRoot, {subtree: true, childList: true, characterData: true});
    }
    scheduleFit(true);
  }

  window.addEventListener('resize', updateMode, {passive: true});
  window.addEventListener('orientationchange', updateMode, {passive: true});
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', observeSheet, {once: true});
  else observeSheet();

"note":"4 espaço(s) de magia de 1º nível."},{"name":"Espaços de magia · 2º nível","used":[false,false,false],"reset":"Descanso longo","note":"3 espaço(s) de magia de 2º nível."},{"name":"Espaços de magia · 3º nível","used":[false,false,false],"reset":"Descanso longo","note":"3 espaço(s) de magia de 3º nível."},{"name":"Espaços de magia · 4º nível","used":[false,false,false],"reset":"Descanso longo","note":"3 espaço(s) de magia de 4º nível."},{"name":"Espaços de magia · 5º nível","used":[false,false],"reset":"Descanso longo","note":"2 espaço(s) de magia de 5º nível."},{"name":"Espaços de magia · 6º nível","used":[false],"reset":"Descanso longo","note":"1 espaço(s) de magia de 6º nível."},{"name":"Espaços de magia · 7º nível","used":[false],"reset":"Descanso longo","note":"1 espaço(s) de magia de 7º nível."},{"name":"Espaços de magia · 8º nível","used":[false],"reset":"Descanso longo","note":"1 espaço(s) de magia de 8º nível."},{"name":"Espaços de magia · 9º nível","used":[false],"reset":"Descanso longo","note":"1 espaço(s) de magia de 9º nível."}],"coins":{"PO":13590,"PP":0,"PC":0,"PE":0,"PL":0},"items":[{"id":"item-0","name":"Balas de Trabuco","qty":15,"note":"Munição para o trabuco"},{"id":"item-1","name":"Maça Fresca Eterna","qty":1,"note":"Item mágico; efeito específico não informado"},{"id":"item-2","name":"Molde de balas para trabuco","qty":1,"note":""},{"id":"item-3","name":"Cristal da Grande Forja","qty":1,"note":"Item de campanha"},{"id":"item-4","name":"Pedra de conjuração mágica","qty":1,"note":"Item de campanha"},{"id":"item-5","name":"Martelo de Moradin","qty":1,"note":"+5 para acertar · 2d8 conforme a ficha"},{"id":"item-6","name":"Trabuco","qty":1,"note":"Alcance 12m · 2d10"},{"id":"item-7","name":"Runa Kenaz","qty":1,"note":"Efeito não especificado na ficha"},{"id":"item-8","name":"Poção de Cura","qty":10,"note":"10 poções registradas na ficha"}],"features":[{"id":"feature-0","name":"Conjuração","text":"Sabedoria é o atributo de conjuração. CD 18 para resistir às magias e +10 nos ataques mágicos. Conhece 5 truques e pode preparar 21 magias de clérigo por dia (17 + SAB +4); magias de domínio não contam nesse limite. Pode conjurar rituais preparados e usar símbolo sagrado como foco."},{"id":"feature-1","name":"Domínio da Vida","text":"Domínio divino dedicado à preservação da vida, cura e sustentação dos aliados."},{"id":"feature-2","name":"Proficiência Bônus","text":"O Domínio da Vida concede proficiência com armaduras pesadas. Barunt também possui armaduras leves, médias e escudos pela classe."},{"id":"feature-3","name":"Discípulo da Vida","text":"Sempre que usar uma magia de 1º nível ou maior para restaurar PV, a criatura recupera PV adicionais iguais a 2 + o nível do espaço de magia."},{"id":"feature-4","name":"Canalizar Divindade","text":"2 usos por descanso curto ou longo. Barunt pode usar Expulsar Mortos-Vivos ou Preservar Vida."},{"id":"feature-5","name":"Expulsar Mortos-Vivos","text":"Como ação, mortos-vivos a até 9m que possam vê-lo ou ouvi-lo fazem um teste de Sabedoria CD 18. Em falha, ficam expulsos por até 1 minuto ou até sofrerem dano."},{"id":"feature-6","name":"Preservar Vida","text":"Canalizar Divindade: distribui até 85 PV entre criaturas a até 9m, sem elevar nenhuma acima de metade dos PV máximos. Não afeta mortos-vivos nem construtos."},{"id":"feature-7","name":"Destruir Mortos-Vivos","text":"Quando um morto-vivo de ND 4 ou menor falha contra Expulsar Mortos-Vivos, ele é destruído."},{"id":"feature-8","name":"Curandeiro Abençoado","text":"Quando conjura uma magia de 1º nível ou maior que restaure PV de outra criatura, Barunt também recupera 2 + o nível do espaço de magia em PV."},{"id":"feature-9","name":"Golpe Divino","text":"Uma vez por turno, quando acerta uma criatura com um ataque de arma, pode causar +2d8 de dano radiante."},{"id":"feature-10","name":"Cura Suprema","text":"No nível 17, quando normalmente rolaria dados para determinar PV restaurados por uma magia, usa o valor máximo de cada dado."},{"id":"feature-11","name":"Intervenção Divina","text":"Como ação, role d100. No nível 17, um resultado de 17 ou menos permite a intervenção da divindade, com o efeito definido pelo Mestre. Após sucesso, só pode usar novamente depois de 7 dias; após falha, depois de um descanso longo."},{"id":"feature-12","name":"Melhorias de Atributo / Talentos","text":"Recebidas nos níveis 4, 8, 12 e 16. As escolhas não estavam identificadas na ficha fornecida, então permanecem sem inventar talentos."},{"id":"feature-13","name":"Visão no Escuro","text":"Anão: visão no escuro a 18m."},{"id":"feature-14","name":"Resiliência Anã","text":"Vantagem em salvaguardas contra veneno e resistência a dano de veneno."},{"id":"feature-15","name":"Treinamento Anão em Combate","text":"Proficiência com machado de batalha, machadinha, martelo leve e martelo de guerra."},{"id":"feature-16","name":"Conhecimento de Pedras","text":"Em testes de História ligados à origem de trabalhos em pedra, considera-se proficiente e dobra o bônus de proficiência."},{"id":"feature-17","name":"Robustez Anã","text":"Anão da Colina: +1 PV máximo por nível. No nível 17, isso representa +17 PV."},{"id":"feature-18","name":"Ferramenta Anã","text":"Escolha 1 entre ferramentas de ferreiro, suprimentos de cervejeiro ou ferramentas de pedreiro. A escolha não foi definida na ficha."},{"id":"feature-19","name":"Acólito — Abrigo dos Fiéis","text":"Como Acólito, possui Intuição e Religião, dois idiomas adicionais à escolha e pode receber apoio básico de membros e templos aliados de sua fé."},{"id":"feature-20","name":"Angelical · Primordial","text":"Características de campanha registradas para Barunt. A ficha não descreve os efeitos mecânicos, então eles foram preservados sem inventar regras."},{"id":"feature-21","name":"Sanidade","text":"84 pontos de Sanidade registrados na ficha de campanha."},{"id":"feature-22","name":"Alinhamento","text":"Neutro/Bom."}],"arrows":[{"id":"domain-0","name":"Bênção · 1º nível","text":"Magia de domínio sempre preparada. Fortalece até três criaturas com 1d4 adicional em ataques e salvaguardas enquanto durar a concentração."},{"id":"domain-1","name":"Curar Ferimentos · 1º nível","text":"Magia de domínio sempre preparada. Cura por toque; Discípulo da Vida e Cura Suprema melhoram a recuperação de Barunt."},{"id":"domain-2","name":"Restauração Menor · 2º nível","text":"Magia de domínio sempre preparada. Encerra uma doença ou uma condição entre cego, surdo, paralisado ou envenenado."},{"id":"domain-3","name":"Arma Espiritual · 2º nível","text":"Magia de domínio sempre preparada. Cria uma arma espectral que ataca como ação bônus e não exige concentração."},{"id":"domain-4","name":"Farol da Esperança · 3º nível","text":"Magia de domínio sempre preparada. Concede vantagem em Sabedoria e salvaguardas contra morte, além de maximizar curas recebidas enquanto durar."},{"id":"domain-5","name":"Revivificar · 3º nível","text":"Magia de domínio sempre preparada. Pode devolver à vida uma criatura morta muito recentemente, conforme os requisitos da magia."},{"id":"domain-6","name":"Proteção contra a Morte · 4º nível","text":"Magia de domínio sempre preparada. Impede que o alvo caia a 0 PV uma vez e também protege contra certos efeitos de morte instantânea."},{"id":"domain-7","name":"Guardião da Fé · 4º nível","text":"Magia de domínio sempre preparada. Invoca um guardião imóvel que pune inimigos que se aproximem."},{"id":"domain-8","name":"Curar Ferimentos em Massa · 5º nível","text":"Magia de domínio sempre preparada. Restaura PV de várias criaturas; no nível 17 os dados de cura são maximizados pela Cura Suprema."},{"id":"domain-9","name":"Reviver os Mortos · 5º nível","text":"Magia de domínio sempre preparada. Traz uma criatura morta de volta à vida dentro do limite de tempo da magia, com os custos e penalidades correspondentes."}],"spellNotes":"CONJURAÇÃO — Clérigo da Vida 17 (D&D 5e 2014)\nAtributo: SAB 18 (+4) · CD de magia 18 · Ataque mágico +10 · Bônus de profici <style id="eron-damage-builder-style">
  .attacks-panel .eron-damage-row > td {
    padding: 0 4px 8px !important;
    background: transparent !important;
  }
  #eron-damage-builder {
    margin: 2px 0 0;
    border: 1px solid #645b45;
    border-radius: 7px;
    background: linear-gradient(180deg,#221e13 0%,#1b1810 100%);
    overflow: hidden;
    box-shadow: inset 0 1px 0 #ffffff08;
  }
  #eron-damage-builder * { box-sizing: border-box; }
  #eron-damage-builder .eron-damage-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 9px;
    border-bottom: 1px solid #494232;
    background: #2a2519;
  }
  #eron-damage-builder .eron-damage-title {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
  }
  #eron-damage-builder .eron-damage-title b {
    color: #d5d1aa;
    font-size: 10px;
    letter-spacing: .8px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #eron-damage-builder .eron-base {
    color: #aba086;
    font-size: 9px;
    white-space: nowrap;
  }
  #eron-damage-builder .eron-clear {
    appearance: none;
    border: 0;
    background: transparent;
    color: #c6c3ba;
    padding: 2px 3px;
    font-size: 9px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  #eron-damage-builder .eron-damage-body { padding: 8px 9px 9px; }
  #eron-damage-builder .eron-check-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 5px 7px;
  }
  #eron-damage-builder .eron-check {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    min-width: 0;
    cursor: pointer;
    color: #e0ded8;
    font-size: 9px;
    line-height: 1.2;
  }
  #eron-damage-builder .eron-check input {
    appearance: auto;
    width: 13px;
    height: 13px;
    min-width: 13px;
    margin: 0;
    padding: 0;
    accent-color: #c3b17e;
    box-shadow: none;
  }
  #eron-damage-builder .eron-check input:disabled { opacity: .35; }
  #eron-damage-builder .eron-check span { min-width: 0; }
  #eron-damage-builder .eron-check strong {
    color: #e7e4dd;
    font-size: 9px;
    font-weight: 600;
  }
  #eron-damage-builder .eron-check em {
    color: #b8ad79;
    font-size: 9px;
    font-style: normal;
    white-space: nowrap;
  }
  #eron-damage-builder .eron-arcane {
    margin-top: 7px;
    border-top: 1px dashed #484232;
    padding-top: 6px;
  }
  #eron-damage-builder .eron-arcane summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #c9c7c0;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .2px;
    cursor: pointer;
    user-select: none;
  }
  #eron-damage-builder .eron-arcane summary::after {
    content: '▾';
    color: #b9b281;
    font-size: 10px;
  }
  #eron-damage-builder .eron-arcane:not([open]) summary::after { content: '▸'; }
  #eron-damage-builder .eron-arcane .eron-check-grid { margin-top: 6px; }
  #eron-damage-builder .eron-roll {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    padding: 7px 8px;
    border: 1px solid #615944;
    border-radius: 6px;
    background: #201f16;
  }
  #eron-damage-builder .eron-roll-label {
    color: #9e9a74;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  #eron-damage-builder .eron-roll strong {
    color: #f0e8b7;
    font-size: 15px;
    line-height: 1.05;
    letter-spacing: .15px;
  }
  #eron-damage-builder .eron-breakdown {
    margin-top: 5px;
    color: #aba086;
    font-size: 8px;
    line-height: 1.35;
  }
  #eron-damage-builder .eron-breakdown b { color: #c6c3ba; font-weight: 600; }
  #eron-damage-builder .eron-warning { color: #c6b988; }
  @media (max-width: 900px) {
    #eron-damage-builder .eron-check-grid { grid-template-columns: 1fr; }
  }
</style>

  function addDie(result,count,sides){ if(!count)return; const k=String(sides); if(!Object.prototype.hasOwnProperty.call(result.dice,k)){result.dice[k]=0;result.order.push(Number(sides));} result.dice[k]+=count; }
  function parseFormula(text){ const r={dice:{},flat:0,order:[]}; let rest=String(text||'').replace(/\s+/g,''); rest=rest.replace(/(\d+)d(\d+)/gi,(_,c,s)=>{addDie(r,Number(c),Number(s));return '';}); const nums=rest.match(/[+-]?\d+/g)||[]; r.flat=nums.reduce((sum,n)=>sum+Number(n),0); return r; }
  function calculate(baseInput,selectedKeys){ const base=baseInput&&baseInput.dice?baseInput:parseFormula(baseInput); const selected=new Set(selectedKeys||[]); const critical=selected.has('critical'); const r={dice:{},flat:Number(base.flat||0),order:[]}; (base.order||Object.keys(base.dice).map(Number)).forEach(s=>addDie(r,Number(base.dice[String(s)]||base.dice[s]||0)*(critical?2:1),Number(s))); OPTION_ORDER.forEach(k=>{ if(!selected.has(k)||k==='critical')return; OPTIONS[k].dice.forEach(d=>addDie(r,d.count*(critical&&d.critical?2:1),d.sides)); r.flat+=Number(OPTIONS[k].flat||0); }); return r; }
  function format(r){ const parts=[]; (r.order||[]).forEach(s=>{const c=Number(r.dice[String(s)]||r.dice[s]||0);if(c)parts.push(c+'d'+s);}); if(r.flat||!parts.length)parts.push((r.flat>=0&&parts.length?'+ ':'')+r.flat); return parts.join(' + ').replace('+ + ','+ '); }
  window.__BARUNT_DAMAGE_CALC__={OPTIONS,parseFormula,calculate,format};
  if(typeof document==='undefined')return;
  function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function optionHtml(key){const o=OPTIONS[key];return '<label class="eron-check" title="'+esc(o.note)+'"><input type="checkbox" data-damage-key="'+key+'"><span><strong>'+esc(o.label)+'</strong> <em>'+esc(o.short)+'</em></span></label>';}
  function panelHtml(baseText){return '<div id="eron-damage-builder"><div class="eron-damage-head"><div class="eron-damage-title"><b>Montador de dano</b><span class="eron-base">Martelo de Moradin: <span data-base-formula>'+esc(baseText)+'</span></span></div><button type="button" class="eron-clear">Limpar</button></div><div class="eron-damage-body"><div class="eron-check-grid">'+OPTION_ORDER.map(optionHtml).join('')+'</div><div class="eron-roll"><span class="eron-roll-label">JOGUE</span><strong data-roll-formula>'+esc(baseText)+'</strong></div><div class="eron-breakdown" data-breakdown>Sem bônus marcados. <b>Golpe Divino:</b> 1x por turno em um acerto com arma.</div></div></div>';}
  function getBaseRow(panel){const rows=panel?Array.from(panel.querySelectorAll('tbody tr')):[];return rows.find(row=>{const n=row.querySelector('td strong');return n&&n.textContent.trim()==='Martelo de Moradin';})||rows[0]||null;}
  function getBaseText(row){if(!row)return '2d8 + 1'; const cells=row.querySelectorAll('td');const strong=cells[2]&&cells[2].querySelector('strong');return strong?strong.textContent.trim().replace(/\s*\+\s*/g,' + '):'2d8 + 1';}
  function selected(root){return Array.from(root.querySelectorAll('input[data-damage-key]:checked')).map(i=>i.dataset.damageKey);}
  function render(root,baseText){if(!root)return;const chosen=selected(root),result=calculate(parseFormula(baseText),chosen),formula=format(result);const baseNode=root.querySelector('[data-base-formula]'),roll=root.querySelector('[data-roll-formula]');if(baseNode)baseNode.textContent=baseText;if(roll)roll.textContent=formula;const lines=[];chosen.forEach(k=>{if(k==='critical')lines.push('<b>Crítico:</b> todos os dados elegíveis deste acerto são dobrados.');else lines.push('<b>Golpe Divino:</b> +2d8 radiante neste acerto.');});if(!chosen.length)lines.push('Sem bônus marcados.');lines.push('<b>Lembrete:</b> Golpe Divino só pode ser aplicado uma vez por turno.');const b=root.querySelector('[data-breakdown]');if(b)b.innerHTML=lines.join(' ');}
  function wire(root,getBase){root.addEventListener('change',()=>render(root,getBase()));const clear=root.querySelector('.eron-clear');if(clear)clear.addEventListener('click',()=>{root.querySelectorAll('input[data-damage-key]').forEach(i=>i.checked=false);render(root,getBase());});}
  function ensurePanel(){const panel=document.querySelector('.play-dashboard .attacks-panel, .attacks-panel');if(!panel)return;const baseRow=getBaseRow(panel);if(!baseRow)return;let root=document.getElementById('eron-damage-builder');const baseText=getBaseText(baseRow);if(!root){const row=document.createElement('tr');row.className='eron-damage-row';const cell=document.createElement('td');cell.colSpan=3;cell.innerHTML=panelHtml(baseText);row.appendChild(cell);baseRow.insertAdjacentElement('afterend',row);root=cell.querySelector('#eron-damage-builder');wire(root,()=>getBaseText(getBaseRow(panel)));}render(root,baseText);}
  let scheduled=false;function schedule(){if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;observer.disconnect();try{ensurePanel();}finally{observer.observe(document.getElementById('root')||document.body,{subtree:true,childList:true});}});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ensurePanel,{once:true});else ensurePanel();
  const observer=new MutationObserver(schedule);observer.observe(document.getElementById('root')||document.body,{subtree:true,childList:true});document.addEventListener('input',schedule,true);document.addEventListener('change',schedule,true);
})();
</script>
